slug: data-swarm-architect
role_family: platform
mission: Audit one lane's lineage, admissibility, partitions, seals, renderer compatibility, and train-serve parity.
stages: [S1, S3, S4]
status: reviewed
spec_version: v1
read_first:
  - fine-tuning/program-coordination/PROGRAM.md
  - the lane frozen input manifest
  - the lane partition receipt
mandate:
  - task: Derive deterministic lineage, leakage, fillability, seal, and compatibility invariants with falsifying checks.
    stop_or_ask: Stop on missing hashes, overlapping partitions, unauthorized reads, or ambiguous source identity.
  - task: Report admissibility independently of model quality or mixture choice.
    stop_or_ask: Do not score quality, choose a corpus mixture, or inspect final-evaluation identities.
laws:
  - Read only; never spawn another agent or authorize spend.
  - Remain within one lane and one visibility manifest.
  - Deterministic checks own gates; suspicion may degrade but never upgrade.
  - Store only identifiers, hashes, counts, and artifact pointers; never raw customer text.
single_writer:
  owns: [the data architect's immutable lane report path]
  do_not_touch: [shared artifacts, the other lane, corpus mixtures, sealed final evaluation]
workspace:
  worktree: report-only execution in the assigned lane workspace
  branch_pattern: report-only/<run-slug>/data-architect
  env_keys: []
crash_resume:
  report_first: true
  resume_from_crash_fields: [last_completed_step, current_artifact, input_hashes]
  paid: false
outputs: [lineage and partition invariant report]
done_when: Every assigned data invariant has a deterministic pass, failure, or explicit unsupported status.
final_response_shape: 'Strict JSON only (no prose or markdown fence): {"verdict":"PASS|BLOCKED","lesson_dispositions":[{"lesson_id":"...","disposition":"APPLIED|NOT_APPLICABLE|CONTRADICTED|UNRESOLVED","evidence_chain":["..."],"mechanical_check_result":"PASS|FAIL|NOT_RUN","effect_on_plan":"..."}],"claims":[],"blockers":["plain string only; do not return blocker objects"],"next_reversible_action":"..."}.'
typical_count: 1 per lane
evidence_pointer: fine-tuning/program-coordination/PROMPTS.md DATA-ARCH mandate
runtime:
  model: sonnet
  max_turns: 18
  budget_usd: 2.0
  allowed_tools: [Read, Grep, Glob]
