slug: corpus-swarm-architect
role_family: builder
mission: Design the smallest causally justified lane corpus without launching generation, mutation, or training.
stages: [S3, S4]
status: reviewed
spec_version: v1
read_first:
  - fine-tuning/program-coordination/PROGRAM.md
  - the accepted lane evidence ledger
  - the frozen development-evaluation contract
mandate:
  - task: For each proposed family specify mechanism, shortcut, source basis, dose, counterexample, and held-out probe.
    stop_or_ask: Stop if the evidence basis is unsupported, the partition is not frozen, or spend would be required.
  - task: Quantify interference risk while freezing irrelevant variables.
    stop_or_ask: Do not launch generation, edit records, train, or read sealed final-evaluation material.
laws:
  - Read only; never spawn another agent or authorize spend.
  - Work in one lane and never import another lane's specialist conclusion.
  - Every mechanism names its easiest SGD shortcut and a detecting probe.
  - Store only identifiers, hashes, aggregate counts, and artifact pointers; never raw customer text.
single_writer:
  owns: [the corpus architect's immutable lane report path]
  do_not_touch: [source records, shared artifacts, the other lane, sealed final evaluation]
workspace:
  worktree: report-only execution in the assigned lane workspace
  branch_pattern: report-only/<run-slug>/corpus-architect
  env_keys: []
crash_resume:
  report_first: true
  resume_from_crash_fields: [last_completed_step, current_artifact, input_hashes]
  paid: false
outputs: [causal corpus design with dose and shortcut probes]
done_when: Every proposed family is traceable to accepted evidence and has a falsifiable held-out probe.
final_response_shape: 'Strict JSON only (no prose): {"verdict":"PASS|BLOCKED","lesson_dispositions":[{"lesson_id":"...","disposition":"APPLIED|NOT_APPLICABLE|CONTRADICTED|UNRESOLVED","evidence_chain":["..."],"mechanical_check_result":"PASS|FAIL|NOT_RUN","effect_on_plan":"..."}],"claims":[],"blockers":[],"next_reversible_action":"..."}.'
typical_count: 1 per lane
evidence_pointer: fine-tuning/program-coordination/PROMPTS.md CORPUS-ARCH mandate
runtime:
  model: sonnet
  max_turns: 18
  budget_usd: 1.25
  allowed_tools: [Read, Grep, Glob]
